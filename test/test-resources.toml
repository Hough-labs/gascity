version = 2

# Every field below is pinned by resourcecensus.bootstrapPolicy. Changing this
# manifest alone fails; an intentional policy change updates the Go policy,
# this file, and the generated TESTING.md table under council review.

# Reviewed increments. Growth is only ever banked here with a LIVE owner and a
# justification; a bump without one is the drift this ledger exists to catch.
# Each increment names its owner inline in the affected rows' resource_owner,
# so the row itself says why the number moved. owner_bead is NOT reused for
# this: it tracks who must drive the whole ratchet to zero, which is never the
# bead that added one call site.
#
# gascity-4zf / df0f1ad31 (gc-zxxy Darwin worktree liveness) is the +1 call and
# +1 file on untagged subprocess and untagged fixed_sleep, in every scope that
# counts them. Both land in cmd/gc/bead_worktree_liveness_test.go, which had
# neither resource before, in TestCollectLiveWorktreeState_ProtectsDirWithLiveProcess:
#   - exec.Command("sleep", "30") parks a real child process in a temp dir.
#     The test proves the scanner reads a FOREIGN process's cwd, which is the
#     production case (the reaper runs in the witness; the process it must not
#     reap is an agent). A second process is inherent to what is asserted.
#   - time.Sleep(200ms) is the poll interval of a deadline-bounded retry loop,
#     not a naive delay: the loop returns as soon as the cwd appears and
#     t.Fatalf's at a 10s deadline, so it can neither hang nor pass on timing.
# The production Darwin lsof call site is NOT counted here; the census scans
# *_test.go only (census.go scanFiles).
#
# gascity-rwu is +1 call and +0 files on subprocess, in every scope that counts
# it. The call site is doctorGitOutput in internal/doctor/checks_test.go, the
# read-side companion to the existing doctorRunGit: it returns trimmed stdout so
# a test can read git state back independently of the code under test.
# checks_session_branch_upstream_test.go, which the helper was added for, builds
# real git repositories and worktrees but constructs no exec.Cmd of its own —
# every git call it makes routes through doctorRunGit or doctorGitOutput. That
# is why files does not move: subprocess construction stayed inside the files
# that already did it, which is what the file ratchet is measuring.
#
# gascity-0zw is +1 call and +0 files on subprocess, in every scope that counts
# it. The call site is runPackScript in examples/bd/dolt/health_test.go: one
# hermetic runner for the dolt pack's command scripts, sitting beside the
# repoRoot / filteredEnv / writeExecutable helpers the package already shares.
# The endpoint-provenance tests it was added for (endpoint_scope_test.go, nine
# tests across status/health/sql/logs) construct no exec.Cmd of their own —
# every pack-script invocation routes through the one helper. Written the
# obvious way those tests would have been +4 calls and +1 file; consolidating
# first is why the ratchet moves by one and why files does not move at all.
# Future pack-script tests should reuse runPackScript rather than add a call
# site, which is the behaviour the file ratchet is meant to produce.

# gascity-ngab is +1 call and +1 file on subprocess, in every scope that counts
# them. Both land in scripts/makefile_gate_parallelism_test.go, which had the
# resource in neither form before:
#   - runGateParallelism is the file's ONLY exec.Command site. It runs
#     scripts/test-gate-parallelism, the script that computes the -parallel
#     bound the `make test` / `make test-mac` gate lanes now carry, with a
#     pinned GC_TEST_LOCAL_CPUS so the arithmetic is asserted against a fixed
#     core count rather than the runner's. Both tables in the file -- the
#     seven-case arithmetic table and the five-case fail-closed table -- route
#     through it. Written the obvious way, one exec per table, this would have
#     been +2 calls; consolidating first is why the ratchet moves by one.
#   - The script cannot be exercised in-process instead. Its shell twin,
#     scripts/test-local-concurrency.sh Part C, sources gc_gate_parallelism
#     directly and needs no subprocess, but that script is wired into no make
#     target and no CI job, so it is manually-run evidence rather than gate
#     coverage. The Go test is the only automated check that the gate lanes
#     cannot silently lose their -parallel bound.

# gascity-t8r1 (gc-zxxy Darwin /proc fallback audit) is +1 call and +1 file on
# subprocess and on fixed_sleep, in every scope that counts them. Both land in
# cmd/gc/cmd_start_drift_pid_liveness_test.go, which had neither resource
# before, and both are inherent to what the file proves: pidGone had inverted
# on any host without procfs, reporting every live PID as gone, so
# waitForPIDExit greenlit a replacement supervisor onto a socket the old one
# still held.
#   - startLivenessSubject is the file's ONLY exec.Command site. A PID-liveness
#     probe cannot be tested without a real process to point it at, and the
#     regression needs both a live subject and a reaped one. Written inline
#     that would have been +4 calls; consolidating first is why this moves by
#     one, following the precedent gascity-0zw set for runPackScript. New tests
#     in that file reuse the helper rather than add a call site.
#   - time.Sleep(10ms) is the poll interval of a deadline-bounded loop waiting
#     for a child to become a zombie, not a naive delay: it returns as soon as
#     pidGone flips and t.Fatalf's at a 5s deadline, so it can neither hang nor
#     pass on timing. Same shape as the gascity-4zf sleep banked above.
# The production fix itself adds no resource: the census scans *_test.go only.

# gascity-ggq (darwin pidutil identity guards) is -1 call and +1 file on
# subprocess, in every scope that counts it. It is the first entry here whose
# call total falls: the file it adds is paid for by consolidating another.
#   - internal/nudgepoller/poller_test.go gains the one new exec site. Its
#     TestAliveWithCmdlineRecognizesRealPollerProcess parks a real process
#     carrying the nudge poller's argv and runs the production predicate
#     (pidutil.AliveWithCmdline over CmdlineMatcher) against it. Every other
#     test in that file feeds the matcher a synthetic argv slice, and every
#     pidutil test drove AliveWithCmdline with a locally written matcher — so
#     both halves were covered and their composition was not. That gap is
#     exactly what let AliveWithCmdline return true on darwin without ever
#     calling its matcher: a recycled PID passed the poller's singleton check,
#     gc skipped spawning a poller, and nudges to that session stopped being
#     delivered with nothing logged. A real process is inherent to what the
#     test proves; a synthetic argv cannot fail that way.
#   - startProcess in internal/pidutil/pidutil_test.go is the offsetting
#     reduction. That file had three exec sites and the darwin coverage needed
#     two more; routing all five through one helper leaves it with one, so the
#     call total drops by one overall. New tests in either file reuse the
#     helper rather than add a site, following the precedent gascity-0zw set
#     for runPackScript.
# The production fix itself adds no resource: the darwin argv and start-time
# sources are sysctl reads, not subprocesses, and the census scans *_test.go
# only.

# gascity-bh0 (bd-script port-probe ambiguity) is +1 call and +1 file on
# subprocess and on net_listen, in every scope that counts them. Both land in
# cmd/gc/gc_beads_bd_port_probe_test.go, which had neither resource before, and
# both are inherent to what the file proves: gc-beads-bd.sh never read the
# port_holder_probed flag, so an lsof probe that timed out was indistinguishable
# from a free port and op_start could launch a second dolt against a port that
# was actually held.
#   - runBdScriptHarness is the file's ONLY exec.Command site. The subject under
#     test is a shell script, so proving its branch behaviour requires running
#     it; the four tests sweep parse capture, the start refusal, and op_probe's
#     exit codes. Written inline that would have been +4 calls; consolidating
#     first is why this moves by one, following the precedent gascity-0zw set
#     for runPackScript and gascity-t8r1 for startLivenessSubject. New tests in
#     that file reuse the helper rather than add a call site.
#   - listeningPort is the file's ONLY net.Listen site. "The port answers but
#     its holder cannot be named" is the exact state the fix has to refuse to
#     start on, and a real bound loopback port is the only way to produce it —
#     a fake helper can claim a port is held, but only a listener makes the
#     script's independent TCP connect agree. closedPort reuses it (bind, read
#     the port, release) so the free-port case is exercised without a second
#     call site, and both start and probe tests share the one helper.
# The production fix itself adds no resource: the census scans *_test.go only.

# The ga-80po0c.* owner_bead ids below are all dangling (gc doctor: 8 findings,
# tracked by gascity-82e). They are left untouched deliberately: re-pointing
# only the rows this increment happens to touch would split ga-80po0c.2.1,
# which also owns environment / cwd / slow_process_gate and four medium rows,
# leaving it dangling anyway. Each family should be re-pointed whole.

# These broad rows retain the audit's point-in-time source needles. They do
# not classify tests. The AST baselines below ignore comments and strings;
# reported_* preserves the historical regex totals for comparison.
