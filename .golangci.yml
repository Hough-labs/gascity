version: "2"

run:
  # golangci-lint otherwise serializes every run on this machine behind ONE
  # lock file: runCommand.preRunE calls acquireFileLock, which locks
  # filepath.Join(os.TempDir(), "golangci-lint.lock") -- a path derived from
  # $TMPDIR alone, independent of GOLANGCI_LINT_CACHE, of the module, and of
  # the working directory. Every worktree and every agent on the box therefore
  # contends on the same file, and the wait is bounded at 5s: a run that
  # cannot take the lock in time exits 3 with "parallel golangci-lint is
  # running". On a machine running several agents that makes the lint gate
  # frequently unrunnable rather than merely slow, and the failure is
  # indistinguishable from a real lint failure to whatever invoked it
  # (gascity-ipk5).
  #
  # The lock's purpose is to stop concurrent runs from corrupting a *shared*
  # cache. gascity-p1l scoped GOLANGCI_LINT_CACHE to $(CURDIR), so runs in
  # different worktrees no longer share one and the thing the lock protects no
  # longer exists here. Those two settings are coupled and must move together;
  # scripts/golangci_lint_parallel_test.go asserts that.
  #
  # allow-serial-runners is deliberately not used instead: it keeps the lock
  # and only drops the 5s timeout, trading an unrunnable gate for an unbounded
  # one on an already-saturated box.
  allow-parallel-runners: true

severity:
  default: error

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports

  exclusions:
    # Same npm-artifact exclusion as the linters block below. `formatters:` is a
    # second, independent walker: gofumpt/goimports descend into node_modules
    # even when the linters block already excludes it, so `make fmt-check`
    # (golangci-lint fmt --diff ./...) needs its own copy of this rule.
    paths:
      - '(^|/)node_modules/'

linters:
  # Keep govet explicit in configured lint. The changed-scope target bounds
  # both this copy and the Go tool's vet to the same affected graph, preserving
  # their distinct diagnostics without repeating either across the whole repo.
  # Other default linters (errcheck, ineffassign, staticcheck, unused) remain
  # enabled alongside these configured extras.
  enable:
    - govet
    - errorlint
    - misspell
    - gocritic
    - revive
    - unconvert
    - unparam

  settings:
    misspell:
      locale: US

  exclusions:
    # Installed npm packages are gitignored build artifacts, not repo source,
    # but they can hold vendored .go files (flatted/golang/pkg/flatted) that sit
    # inside this module — `go list ./...` picks them up because they carry no
    # nested go.mod. golangci-lint v2 dropped v1's implicit default skip-dirs,
    # so without this the gate is red for every branch on any machine that has
    # run `npm install`, and it reports findings nobody can fix (gascity-itqq).
    #
    # Matched as a whole path segment so a legitimate repo path that merely
    # contains the substring still lints. Deliberately not pinned to the
    # dashboard's node_modules: the repo has four npm roots (contrib/
    # openclaw-bridge, internal/api/dashboardspa/web and its frontend/ and
    # shared/ workspaces), and each would otherwise reproduce this bug.
    paths:
      - '(^|/)node_modules/'
    rules:
      # runtime shadows stdlib but is isolated to internal/.
      - path: internal/runtime/
        linters:
          - revive
        text: "var-naming"
      # exec is an established package name — renaming would break imports.
      - path: internal/runtime/exec/
        linters:
          - revive
        text: "var-naming"
      - path: internal/beads/exec/
        linters:
          - revive
        text: "var-naming"
      # api is an established package name for the HTTP API server.
      - path: internal/api/
        linters:
          - revive
        text: "var-naming"
      # mail is an established package name — renaming would break imports.
      - path: internal/mail/
        linters:
          - revive
        text: "var-naming"
      # extmsg is an established package name for external messaging.
      - path: internal/extmsg/
        linters:
          - revive
        text: "var-naming"
      # These domain packages intentionally use package-qualified exported names
      # (for example sling.SlingResult) to keep adapter call sites explicit.
      - path: internal/convoy/
        linters:
          - revive
        text: "stutters"
      - path: internal/graphroute/
        linters:
          - revive
        text: "stutters"
      - path: internal/sling/
        linters:
          - revive
        text: "stutters"
